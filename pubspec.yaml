name: projects
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Core utilities
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.3
  intl: ^0.20.2
  timezone: ^0.9.2
  url_launcher: ^6.1.12

  # Firebase
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  cloud_firestore: ^6.1.0
  firebase_storage: ^13.0.4
  firebase_messaging: ^16.0.4
  google_sign_in: ^6.2.1

  # UI & media
  flutter_inappwebview: ^6.1.0
  webview_flutter: ^4.7.0
  youtube_player_flutter: ^9.1.3
  image_picker: ^1.2.0
  fl_chart: ^1.1.1

  # Notifications
  flutter_local_notifications: ^17.2.0

  # AI & ML
  flutter_ai_toolkit: ^0.10.0
  google_generative_ai: ^0.4.7

  #State Management
  provider: ^6.0.5

 #Voice
  flutter_tts: ^3.8.0

#Background Sound
  audioplayers: ^5.2.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/avatars/
    - assets/audio/Healing.mp3
    - assets/sign_up.png
    - assets/sign_in.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/logo.png
  android: true
  ios: true
